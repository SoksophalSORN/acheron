spring.application.name=acheron

## --- H2 in-memory Database ---

# Sets up an in-memory H2 database named "testdb" that persists until the JVM stops.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1 

# Tells Spring to use the H2 JDBC driver for database connections.
spring.datasource.driverClassName=org.h2.Driver

# Sets the database username to "sa" (default admin for H2).
spring.datasource.username=sa

# Leaves the database password blank (default for H2).
spring.datasource.password=

## --- JPA / Hibernate ---

# Configures Hibernate to generate SQL optimized for H2.
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Automatically creates tables at startup and drops them at shutdown.
spring.jpa.hibernate.ddl-auto=create-drop

# Prints all executed SQL statements to the console.
spring.jpa.show-sql=true

## --- Enable H2 Console (optional but recommended for dev) ---

# Enables a web interface to interact with the H2 database.
spring.h2.console.enabled=true

# Sets the URL path for the H2 web console to "/h2-console".
spring.h2.console.path=/h2-console
