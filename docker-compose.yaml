services:
  mysql:
    image: 'mysql:8'
    environment:
      - MYSQL_DATABASE: "acheron"
      - MYSQL_USER: ${MYSQL_USER}
      - MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - default: {}
  acheron:
    build: .
    ports:
      - "8080:8080"
    networks:
      - acheron
    depends_on:
      - db

networks:
  default: {}

volumes:
  db_data:
